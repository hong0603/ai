<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Shorts Generator</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.container{
  max-width:800px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  color:#60a5fa;
}

textarea{
  width:100%;
  height:140px;
  padding:10px;
  border-radius:10px;
}

button{
  margin-top:10px;
  padding:12px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

.card{
  background:#1e293b;
  padding:15px;
  border-radius:12px;
  margin-top:20px;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 AI Shorts Generator</h1>

<textarea id="story" placeholder="줄거리를 입력하세요"></textarea>

<button onclick="generate()">AI 대본 생성</button>

<div class="card" id="result">결과가 여기에 표시됩니다</div>

</div>

<script>
async function generate(){

  const story=document.getElementById("story").value;

  document.getElementById("result").innerText="생성중...";

  const res=await fetch("/api/generate",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({story})
  });

  const data=await res.json();

  document.getElementById("result").innerText=data.result;
}
</script>

</body>
</html>
